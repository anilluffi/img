<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Чек печать изображения</title>

<style>
  body {
    margin: 0;
    padding: 0;
    background: #fff;
    font-family: Arial, sans-serif;
  }

  /* ОБЛАСТЬ ПЕЧАТИ */
  .print-area {
    width: 80mm;
    padding: 0;
    margin: 0;
    position: absolute;
    top: 0;
    left: 0;
  }

  img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* КНОПКА */
  .controls {
    padding: 10px;
  }

  button {
    padding: 8px 12px;
    font-size: 14px;
  }

  /* ПЕЧАТЬ */
  @media print {
    body {
      margin: 0;
    }

    .controls {
      display: none;
    }

    .print-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 80mm;
    }
  }
</style>
</head>

<body>

<div class="controls">
  <input type="file" id="fileInput" accept="image/*" />
  <button onclick="window.print()">Печать</button>
</div>

<div class="print-area">
  <img id="preview" />
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');

  fileInput.addEventListener('change', function () {
    const file = this.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (e) {
      preview.src = e.target.result;
    };

    reader.readAsDataURL(file);
  });
</script>

</body>
</html>
